version: 2
project_name: airtable-pp-cli
changelog:
  disable: true
builds:
  - id: airtable-pp-cli
    main: ./cmd/airtable-pp-cli
    binary: airtable-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/productivity/airtable/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: airtable-pp-mcp
    main: ./cmd/airtable-pp-mcp
    binary: airtable-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: airtable-pp-cli
    repository:
      owner: elizabethcstone
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Airtable REST API CLI with offline cross-base search, CSV merge-upserts, field-level diffs before bulk writes, and schema drift detection."
    install: |
      bin.install "airtable-pp-cli"
      bin.install "airtable-pp-mcp"
