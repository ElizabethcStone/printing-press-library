  attachments:
    description: "Direct attachment upload to a cell"
    endpoints:
      upload:
        method: POST
        example: "  airtable-pp-cli attachments fldAbC123dEf456Gh --base appLkNDICXNqxSDhG --record-id recA1b2C3d4E5f6G7 --file photo.jpg --filename photo.jpg --content-type image/jpeg"
        path: "/v0/{base_id}/{record_id}/{field_id}/uploadAttachment"
        base_url: "https://content.airtable.com"
        description: "Upload a file (up to 5MB) directly to an attachment cell"
        params:
          - name: base_id
            flag_name: base
            type: string
            required: true
            positional: false
            description: "Base ID"
          - name: record_id
            type: string
            required: true
            positional: false
            description: "Record ID"
          - name: field_id
            type: string
            required: true
            positional: true
            description: "Attachment field name or ID"
        body:
          - name: contentType
            flag_name: content-type
            type: string
            required: true
            description: "MIME type, e.g. image/jpeg"
          - name: file
            type: string
            required: true
            description: "Base64-encoded file bytes"
          - name: filename
            type: string
            required: true
            description: "Filename, e.g. photo.jpg"

  user:
    description: "Authenticated user identity and token scopes"
    endpoints:
      get:
        method: GET
        path: "/v0/meta/whoami"
        description: "Get the authenticated user's ID, and token scopes/email if the token has those scopes"
