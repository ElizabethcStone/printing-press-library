version: 2
project_name: crocoblock-pp-cli
changelog:
  disable: true
builds:
  - id: crocoblock-pp-cli
    main: ./cmd/crocoblock-pp-cli
    binary: crocoblock-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/developer-tools/crocoblock/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: crocoblock-pp-mcp
    main: ./cmd/crocoblock-pp-mcp
    binary: crocoblock-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: crocoblock-pp-cli
    repository:
      owner: bobeglz
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Operate Crocoblock data and review changes across your WordPress workflows."
    install: |
      bin.install "crocoblock-pp-cli"
      bin.install "crocoblock-pp-mcp"
