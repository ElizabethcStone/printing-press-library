{
  "name": "crocoblock",
  "description": "Operate supported Crocoblock WordPress data and compare verified local snapshots.",
  "version": "0.1.0",
  "category": "developer-tools",
  "base_url": "https://wordpress.example/wp-json",
  "health_check_path": "/wp/v2/users/me?context=edit",
  "http_transport": "standard",
  "required_headers": [
    {
      "name": "User-Agent",
      "value": "crocoblock-pp-cli/0.1.0 (authorized WordPress API client)"
    }
  ],
  "auth": {
    "type": "api_key",
    "header": "Authorization",
    "format": "Basic {username}:{password}",
    "in": "header",
    "env_vars": [
      "CROCOBLOCK_USERNAME",
      "CROCOBLOCK_APPLICATION_PASSWORD"
    ]
  },
  "config": {
    "format": "toml",
    "path": "~/.config/crocoblock-pp-cli/config.toml"
  },
  "cache": {
    "enabled": false
  },
  "learn": {
    "entity_lookup_seeds": {
      "plugin": [
        {
          "canonical": "jet-engine",
          "aliases": [
            "jetengine",
            "jet engine"
          ]
        },
        {
          "canonical": "jet-form-builder",
          "aliases": [
            "jetformbuilder",
            "formularios"
          ]
        },
        {
          "canonical": "jet-booking",
          "aliases": [
            "jetbooking",
            "reservas por noche"
          ]
        },
        {
          "canonical": "jet-appointments-booking",
          "aliases": [
            "jetappointment",
            "citas"
          ]
        },
        {
          "canonical": "jet-smart-filters",
          "aliases": [
            "jetsmartfilters",
            "filtros"
          ]
        }
      ]
    },
    "synonyms": {
      "m\u00e1s recientes": "latest",
      "custom content type": "cct"
    }
  },
  "mcp": {
    "transport": [
      "stdio"
    ],
    "orchestration": "endpoint-mirror",
    "endpoint_tools": "hidden"
  },
  "resources": {
    "transport": {
      "description": "Internal transport contracts; curated command adapters replace the raw surface.",
      "endpoints": {
        "index": {
          "method": "GET",
          "path": "/",
          "description": "Verified upstream contract for transport index; use curated Crocoblock commands for redaction and validation.",
          "params": [],
          "response": {
            "type": "object"
          }
        },
