      description: 'Update a workflow. If the workflow is published, the updated version
        will be automatically re-published unless `publishIfActive` is set to `false`.
        Because that re-publication puts a new version live, it additionally requires
        the `workflow:activate` API key scope and the `workflow:publish` project permission.
        A caller without either can still save: the new version is stored as a draft
        and the response is a `403` naming the missing permission, leaving the published
        version live. Saving an unpublished workflow, or saving with `publishIfActive=false`,
        only needs `workflow:update`.'
