    importResultDto.generated:
      type: object
      properties:
        package:
          type: object
          properties:
            sourceN8nVersion:
              type: string
            sourceId:
              type: string
            exportedAt:
              type: string
              format: date-time
          required:
          - sourceN8nVersion
          - sourceId
          - exportedAt
        workflows:
          type: array
          items:
            type: object
            properties:
              sourceWorkflowId:
                type: string
                description: Workflow id as it appeared in the package.
              localId:
                type: string
                description: 'Workflow id on the target instance: newly assigned for
                  `created` (fresh under `workflowIdPolicy=new`, the package id under
                  `source`), the existing workflow''s id for `updated`/`skipped`.'
              name:
                type: string
              projectId:
                type: string
              parentFolderId:
                type: string
                nullable: true
              activeVersionId:
                type: string
                nullable: true
                description: Published version on the target instance, if any. `null`
                  when the workflow is not published after import.
              isArchived:
                type: boolean
                description: Whether the workflow is archived on the target after
                  import. Under `new-version` this follows the package's `isArchived`
                  flag. A skipped workflow keeps its own state.
              publishing:
                type: object
                properties:
                  state:
                    type: string
                    enum:
                    - published
                    - unpublished
                    - unchanged
                    - blocked
                    - failed
                    description: '`blocked` means the imported version could not be
                      published and no version is active (for example because the
                      workflow uses a stubbed credential, or uses a node type this
                      instance does not have). When a prior published version remains
                      active, `state` is `unchanged` with `skippedPublishReason` instead.
                      `failed` means publish or unpublish was attempted but did not
                      succeed.'
                  error:
                    type: string
                    description: Present when `state` is `failed`. Explains why publish
                      or unpublish could not be applied.
                  blockedReason:
                    type: string
                    enum:
                    - stub-credential
                    - missing-node-type
                    description: 'Present when `state` is `blocked`: the imported
                      version could not be published and no version is active.'
                  skippedPublishReason:
                    type: string
                    enum:
                    - stub-credential
                    - missing-node-type
                    description: 'Present when `state` is `unchanged` but the policy
                      wanted to publish the imported version: a prior published version
                      is still active (for example after an update with stubbed credentials).'
                required:
                - state
                description: Outcome of applying the selected publishing policy to
                  this workflow.
              status:
                type: string
                enum:
                - created
                - updated
                - skipped
                description: Import outcome for this package workflow.
            required:
            - sourceWorkflowId
            - localId
            - name
            - projectId
            - parentFolderId
            - activeVersionId
            - isArchived
            - publishing
            - status
        removedWorkflows:
          type: array
          items:
            type: object
            properties:
              workflowId:
                type: string
                description: Id of the removed workflow on this instance.
              name:
