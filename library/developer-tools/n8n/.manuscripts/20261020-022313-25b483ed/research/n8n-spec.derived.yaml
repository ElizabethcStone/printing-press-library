        required: true
        description: The ID of the workflow.
        name: workflowId
        in: path
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'true'
          description: Whether to publish the update if the workflow is currently
            published. Set to `false` to save the change as a draft on the existing
            published version instead of releasing it. Has no effect on a workflow
            that isn't currently published.
        required: false
        name: publishIfActive
        in: query
