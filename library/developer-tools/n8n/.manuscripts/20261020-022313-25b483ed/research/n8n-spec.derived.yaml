                    description: 'Syslog facility code (0–23, per RFC 5424). Common
                      values: 0 Kernel, 1 User, 3 System, 13 Audit, 14 Alert, 16 Local0,
                      17 Local1, 18 Local2, 19 Local3, 20 Local4, 21 Local5, 22 Local6,
                      23 Local7.'
                    example: 16
                  app_name:
                    type: string
                    description: Application name reported in the syslog message.
                    example: n8n
                  tlsCa:
                    type: string
                    description: PEM-encoded CA certificate used when `protocol` is
                      `tls`.
                required:
                - type
                - host
              - type: object
                properties:
                  label:
                    type: string
                    minLength: 1
                    description: Human-readable name shown in the UI.
                    example: My destination
                  enabled:
                    type: boolean
                    description: Whether the destination currently receives events.
                    example: true
                  subscribedEvents:
                    type: array
                    items:
                      type: string
                    description: Event names (or group prefixes, e.g. `n8n.workflow`,
                      which matches all `n8n.workflow.*` events) this destination
                      receives. Retrieve the full list of streamable event names from
                      `GET /settings/log-streaming/event-types`.
                    example:
                    - n8n.workflow
                    - n8n.audit
                  anonymizeAuditMessages:
                    type: boolean
                    description: Whether audit message payloads are anonymized before
                      being sent.
                    example: false
                  circuitBreaker:
                    type: object
                    properties:
                      maxFailures:
                        type: integer
                        minimum: 0
                        exclusiveMinimum: true
                        description: Maximum failures within the sliding window before
                          the breaker opens.
                      failureWindow:
                        type: integer
                        minimum: 0
                        exclusiveMinimum: true
                        description: Sliding window, in milliseconds, over which failures
                          are counted.
                    description: Circuit-breaker tuning for delivery. After repeated
                      failures the destination stops sending for a cool-down window
                      instead of hammering an unhealthy target. All fields are optional;
                      sensible defaults apply when omitted.
                  type:
                    type: string
                    enum:
                    - sentry
                    description: Sends each event to a Sentry project.
                    example: sentry
                  dsn:
                    type: string
                    format: uri
                    description: Sentry DSN the events are sent to.
                    example: https://examplePublicKey@o0.ingest.sentry.io/0
                required:
                - type
                - dsn
              description: 'A log streaming destination. The `type` field selects
                the variant and its type-specific fields: `webhook`, `syslog`, or
                `sentry`.'
              type: object
      responses:
