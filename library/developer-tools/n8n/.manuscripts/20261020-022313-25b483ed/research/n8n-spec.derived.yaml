      operationId: continueApplyPackage
      tags:
      - Promotions
      summary: Continue Apply after binding setup
      description: 'Rechecks the configured source and current target bindings. Send
        expectedSource with the configId, branchName, and full commitSha from the
        reviewed Apply result. Send `confirmDestructiveChanges: true` to also apply
        destructive data table changes. Status `source-changed` requires a new Apply
        review. Status `blocked` returns fresh binding details without import writes.
        Status `applied` includes counts and warnings. Inspect status before reading
        counts. Existing target variable values are preserved. Requires the same cloned
        instance connection and permissions as Apply. The importer checks user write
        permissions; granular API-key write scopes are not passed to it. No server
        session or exactly-once guarantee is provided.'
      x-required-scope: gitConnection:pull
      x-eov-operation-id: unreachable
      x-eov-operation-handler: v1/handlers/decorator-routed.handler
