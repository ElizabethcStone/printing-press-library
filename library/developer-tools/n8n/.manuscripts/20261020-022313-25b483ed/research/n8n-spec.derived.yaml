        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
                type:
                  type: string
                  enum:
                  - git
                  - gitlab
                auth:
                  oneOf:
                  - type: object
                    properties:
                      authType:
                        type: string
                        enum:
                        - ssh-key
                      keyType:
                        type: string
                        enum:
                        - ed25519
                        - rsa
                        default: ed25519
                    required:
                    - authType
                    additionalProperties: false
                  - type: object
                    properties:
                      authType:
                        type: string
                        enum:
                        - token
                      username:
                        type: string
                        minLength: 1
                        description: Required for plain Git token authentication.
                          For GitLab, the service ignores this field and uses n8n
                          for Git transport.
                      password:
                        type: string
                        minLength: 1
                    required:
                    - authType
                    - password
                    additionalProperties: false
                  type: object
                config:
                  type: object
                  properties:
                    schemaVersion:
                      type: number
                      enum:
                      - 1
                    baseUrl:
                      type: string
                  required:
                  - schemaVersion
                  - baseUrl
                  additionalProperties: false
              required:
              - name
              - type
              - auth
              additionalProperties: false
      responses:
        '201':
          description: Operation successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider:
                    type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                        maxLength: 36
                      name:
                        type: string
                      type:
                        type: string
                        enum:
                        - git
                        - gitlab
                      authType:
                        type: string
                        enum:
                        - ssh-key
                        - token
                      config:
                        anyOf:
                        - type: object
                          properties:
                            schemaVersion:
                              type: number
                              enum:
                              - 1
                            publicKey:
                              type: string
                              minLength: 1
                            keyType:
                              type: string
                              enum:
                              - ed25519
                              - rsa
                          required:
                          - schemaVersion
                          - publicKey
                          - keyType
                          additionalProperties: false
                        - type: object
                          properties:
                            schemaVersion:
                              type: number
                              enum:
                              - 1
                          required:
                          - schemaVersion
                          additionalProperties: false
                        - type: object
                          properties:
                            schemaVersion:
                              type: number
                              enum:
                              - 1
                            baseUrl:
                              type: string
                          required:
                          - schemaVersion
                          - baseUrl
                          additionalProperties: false
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                    required:
                    - id
                    - name
                    - type
                    - authType
                    - config
                    - createdAt
                    - updatedAt
                  publicKey:
                    type: string
                    nullable: true
