          - n8nProjectRoles
          description: Mapping of SAML attributes to n8n user fields.
          additionalProperties: false
        metadata:
          type: string
          description: Identity provider metadata in XML format. Redacted on read
            when set because it contains IdP certificates; never echoed back in plaintext.
            Use an empty string when unset.
          example: '**hidden**'
        metadataUrl:
          type: string
          description: URL to fetch identity provider metadata from. Use an empty
