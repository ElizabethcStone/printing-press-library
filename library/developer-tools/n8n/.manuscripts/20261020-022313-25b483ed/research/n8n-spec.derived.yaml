        '200':
          description: Operation successful.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    packageName:
                      type: string
                      description: npm package name
                    installedVersion:
                      type: string
                      description: Currently installed version
                    authorName:
                      type: string
                      description: Package author name
                    authorEmail:
                      type: string
                      description: Package author email
                    installedNodes:
