                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
                    updateAvailable:
                      type: string
                      description: Version available for update, if any
                    failedLoading:
                      type: boolean
                      description: Whether the package failed to load
                  required:
                  - packageName
                  - installedVersion
                  - installedNodes
                  - createdAt
                  - updatedAt
        '400':
