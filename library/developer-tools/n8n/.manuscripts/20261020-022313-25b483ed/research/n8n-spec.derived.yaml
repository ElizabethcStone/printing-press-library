    get:
      operationId: getSamlConfiguration
      tags:
      - SettingsSsoSaml
      summary: Retrieve the SAML SSO configuration
      description: Retrieve the current SAML SSO configuration, including every field
        exposed in the UI plus the service provider entity ID and ACS return URL.
        Signing private keys, signing certificates, and identity provider metadata
        are redacted on read. Requires the `saml:manage` scope and the SAML feature
        to be licensed.
      x-required-scope: saml:manage
      x-eov-operation-id: unreachable
      x-eov-operation-handler: v1/handlers/decorator-routed.handler
      x-decorator-routed: true
      responses:
        '200':
          description: Operation successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/samlConfigurationPublicDto.generated'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
    put:
      operationId: updateSamlConfiguration
      tags:
      - SettingsSsoSaml
      summary: Set the SAML SSO configuration
      description: Replace the SAML SSO configuration with the provided full object.
        Every writable field must be sent; use empty strings or empty arrays when
        a value is unset. Read-only `entityID` / `returnUrl` from GET are ignored
        if included, so a GET response can be sent back as a PUT body. Redacted secret
        placeholders keep the stored values unchanged. The update takes effect exactly
        as it would from the UI, using the same validation. Requires the `saml:manage`
        scope and the SAML feature to be licensed. When the configuration is managed
        via environment variables, the write is rejected with 409 and no changes are
        made.
      x-required-scope: saml:manage
      x-eov-operation-id: unreachable
      x-eov-operation-handler: v1/handlers/decorator-routed.handler
      x-decorator-routed: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mapping:
                  type: object
                  properties:
                    email:
                      type: string
                      description: SAML attribute mapped to the user's email.
                    firstName:
                      type: string
                      description: SAML attribute mapped to the user's first name.
                    lastName:
                      type: string
                      description: SAML attribute mapped to the user's last name.
                    userPrincipalName:
                      type: string
                      description: SAML attribute mapped to the user's principal name.
                    emailVerified:
                      type: string
                      description: SAML attribute that states whether the identity
                        provider verified the user's email. Accepted values are `true`
                        and `false`, case-insensitive. Use an empty string when unused.
                    n8nInstanceRole:
                      type: string
                      description: SAML attribute mapped to the n8n instance role.
                        Use an empty string when unused.
                    n8nProjectRoles:
                      type: array
                      items:
                        type: string
                      description: SAML attributes mapped to n8n project roles, formatted
                        as `<projectId>:<role>`. Use an empty array when unused.
                  required:
                  - email
                  - firstName
                  - lastName
                  - userPrincipalName
                  - emailVerified
                  - n8nInstanceRole
                  - n8nProjectRoles
                  additionalProperties: false
                  description: Mapping of SAML attributes to n8n user fields. Use
                    empty strings / empty arrays for unused attributes.
                metadata:
                  type: string
                  description: Identity provider metadata in XML format. Use an empty
                    string to clear stored metadata (also clears metadataUrl when
                    no URL is provided). Use the redaction placeholder from a prior
                    GET to leave an existing value unchanged.
                metadataUrl:
                  type: string
                  description: URL to fetch identity provider metadata from. Use an
                    empty string to clear a stored URL.
                ignoreSSL:
                  type: boolean
                  description: Whether to ignore SSL certificate errors when fetching
                    metadata from a URL.
                  example: false
                loginBinding:
                  type: string
                  enum:
                  - redirect
                  - post
                  description: SAML login request binding.
                  example: redirect
                loginEnabled:
                  type: boolean
                  description: Whether SAML login is enabled.
                  example: false
                loginLabel:
                  type: string
                  description: Label shown on the SAML login button.
                  example: SAML
                authnRequestsSigned:
                  type: boolean
                  description: Whether authentication requests are signed.
                  example: false
                wantAssertionsSigned:
                  type: boolean
                  description: Whether signed assertions are required.
                  example: true
                wantMessageSigned:
                  type: boolean
                  description: Whether signed SAML messages are required.
                  example: true
                emailVerifiedRequired:
                  type: boolean
                  description: Whether the identity provider must assert that the
                    user's email address is verified before a login is linked to an
                    existing user by email. When disabled, only an explicit negative
                    assertion is rejected.
                  example: false
                signingPrivateKey:
                  type: string
                  description: PEM-encoded private key for signing SAML AuthnRequests.
                    Use an empty string to clear an existing key, or the redaction
                    placeholder from a prior GET to leave it unchanged.
                signingCertificate:
                  type: string
                  description: PEM-encoded certificate containing the public key matching
                    the signing private key. Use an empty string when unused or to
                    clear an existing certificate.
                acsBinding:
                  type: string
                  enum:
                  - redirect
                  - post
                  description: Assertion Consumer Service binding.
                  example: post
                signatureConfig:
                  type: object
                  properties:
                    prefix:
                      type: string
                      example: ds
                    location:
                      type: object
                      properties:
                        reference:
                          type: string
                          example: /samlp:Response/saml:Issuer
                        action:
                          type: string
                          enum:
                          - before
                          - after
                          - prepend
                          - append
                          example: after
                      required:
                      - reference
                      - action
                      additionalProperties: false
                  required:
                  - prefix
                  - location
                  additionalProperties: false
                  description: Configuration for the signature in SAML requests and
                    responses.
                relayState:
                  type: string
                  description: Default relay state value for SAML requests. Use an
                    empty string when unused.
                  example: https://n8n.example.com
                entityID:
                  type: string
                  description: Service provider entity ID. Returned by GET for convenience;
                    ignored on write so a GET response can be sent back as a PUT body.
                  example: https://n8n.example.com/rest/sso/saml/metadata
                returnUrl:
                  type: string
                  description: Assertion Consumer Service return URL. Returned by
                    GET for convenience; ignored on write so a GET response can be
                    sent back as a PUT body.
                  example: https://n8n.example.com/rest/sso/saml/acs
              required:
              - mapping
              - metadata
              - metadataUrl
              - ignoreSSL
              - loginBinding
              - loginEnabled
              - loginLabel
              - authnRequestsSigned
              - wantAssertionsSigned
              - wantMessageSigned
              - emailVerifiedRequired
              - signingPrivateKey
              - signingCertificate
              - acsBinding
              - signatureConfig
              - relayState
              additionalProperties: false
              description: Full SAML SSO configuration. Every field must be provided;
