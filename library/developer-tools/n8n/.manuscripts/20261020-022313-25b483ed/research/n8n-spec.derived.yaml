                  example: n8n
                exporterHeaders:
                  type: string
                  description: Additional headers sent to the OTLP collector, as a
                    single string of comma-separated `key=value` pairs (e.g. `authorization=Bearer
                    my-token,x-tenant-id=acme`). Whitespace around each key and value
                    is trimmed; a value may contain spaces but not commas. Use an
                    empty string when unused.
