      operationId: createPromotionProvider
      tags:
      - Promotions
      summary: Create a promotion provider
      description: Creates a provider and its authentication material. A Git host
        provider validates authenticated API access before it saves. For GitLab, the
        service uses n8n as the Git transport username. Its auth.username is optional.
        The service ignores any supplied username. Plain Git token authentication
        requires auth.username. An SSH provider returns the generated public key;
        add it to the remote as a deploy key.
      x-required-scope: gitConnection:create
      x-eov-operation-id: unreachable
      x-eov-operation-handler: v1/handlers/decorator-routed.handler
      x-decorator-routed: true
