    put:
      operationId: setOidcConfiguration
      tags:
      - SettingsSsoOidc
      summary: Set the OIDC SSO configuration
      description: Set the OIDC SSO configuration. The update takes effect exactly
        as it would from the UI, using the same validation. `clientId`, `clientSecret`
        and `discoveryEndpoint` are required; submit the redacted client secret sentinel
        to keep the stored secret unchanged. Requires the `oidc:manage` scope and
        the OIDC feature to be licensed. The client secret is redacted in the response.
        When the configuration is managed declaratively (via environment variables),
        the write is rejected with 409 and no changes are made.
      x-required-scope: oidc:manage
      x-eov-operation-id: unreachable
      x-eov-operation-handler: v1/handlers/decorator-routed.handler
      x-decorator-routed: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId:
                  type: string
                  minLength: 1
                  description: The client ID issued when registering n8n with the
                    OIDC provider.
                  example: n8n-client
                clientSecret:
                  type: string
                  minLength: 1
                  description: The client secret issued when registering n8n with
                    the OIDC provider. Submit the redacted sentinel value returned
                    on read to keep the stored secret unchanged.
                  example: my-client-secret
                discoveryEndpoint:
                  type: string
                  format: uri
                  description: The OIDC provider's well-known discovery endpoint.
                  example: https://accounts.google.com/.well-known/openid-configuration
                loginEnabled:
                  type: boolean
                  description: Whether OIDC single sign-on is enabled.
                  example: false
                prompt:
                  type: string
                  enum:
                  - none
                  - login
                  - consent
                  - select_account
                  - create
                  description: The prompt parameter to use when authenticating.
                  example: select_account
                authenticationContextClassReference:
                  type: array
                  items:
                    type: string
                  description: ACR values to include in the authorization request
                    (acr_values parameter), in order of preference. Use an empty array
                    when unused.
                  example:
                  - mfa
                  - pwd
                additionalScopes:
                  type: string
                  description: Additional scopes to request, space separated. n8n
                    always requests `openid`, `profile` and `email`. Use an empty
                    string when unused.
                  example: groups roles
                emailVerifiedRequired:
                  type: boolean
                  description: Whether the identity provider must assert that the
                    user's email address is verified before the login is accepted.
                    When disabled, only an explicit negative assertion is rejected.
                  example: false
                rpInitiatedLogoutEnabled:
                  type: boolean
                  description: Whether signing out of n8n also ends the session at
                    the OIDC provider via RP-Initiated Logout. When disabled, sign-out
                    is local to n8n only.
                  example: false
              required:
              - clientId
              - clientSecret
              - discoveryEndpoint
              - loginEnabled
              - prompt
              - authenticationContextClassReference
              - additionalScopes
              - emailVerifiedRequired
              - rpInitiatedLogoutEnabled
              additionalProperties: false
              description: 'Full OIDC SSO configuration to set. This is a full replacement:
                every writable field must be provided. Partial updates are rejected.
                Submit the redacted secret sentinel for `clientSecret` to keep the
                stored secret unchanged.'
      responses:
        '200':
          description: Operation successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oidcConfigurationPublicDto.generated'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '409':
          $ref: '#/components/responses/conflict'
        '415':
          $ref: '#/components/responses/unsupportedMediaType'
