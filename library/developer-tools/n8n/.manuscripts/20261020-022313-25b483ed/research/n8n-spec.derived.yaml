      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                personalSpacePublishing:
                  type: boolean
                  description: Whether members may publish workflows and agents from
                    their personal space.
                  example: false
                personalSpaceSharing:
                  type: boolean
                  description: Whether members may share workflows and credentials
                    from their personal space.
                  example: false
                redactionEnforcement:
                  type: object
                  properties:
                    floor:
                      type: string
                      enum:
                      - false
                      - production
                      - all
                      description: Minimum execution-data redaction level enforced
                        across the instance.
                      example: production
                  required:
                  - floor
                  additionalProperties: false
                publishedPersonalWorkflowsCount:
                  type: integer
                  description: Read-only usage count returned by GET. Ignored on write
                    so a GET response can be sent back as a PUT body.
                sharedPersonalWorkflowsCount:
                  type: integer
                  description: Read-only usage count returned by GET. Ignored on write
                    so a GET response can be sent back as a PUT body.
                sharedPersonalCredentialsCount:
                  type: integer
                  description: Read-only usage count returned by GET. Ignored on write
                    so a GET response can be sent back as a PUT body.
              required:
              - personalSpacePublishing
              - personalSpaceSharing
              - redactionEnforcement
              additionalProperties: false
              description: Full security policy. All writable fields must be provided;
                partial updates are not supported.
