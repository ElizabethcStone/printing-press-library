      summary: Install a community package
      description: Install a community package by npm name and optional version.
      x-required-scope: communityPackage:install
      x-eov-operation-id: unreachable
      x-eov-operation-handler: v1/handlers/decorator-routed.handler
      x-decorator-routed: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: npm package name. Unscoped names start with n8n-nodes-.
                    Scoped names use the @[author]/n8n-nodes- form.
                version:
                  type: string
                  description: Semver version or npm dist-tag, such as latest or beta.
                    When unverified packages are disabled, only versions verified
                    by n8n can be installed.
              required:
              - name
      responses:
        '200':
          description: Operation successful.
