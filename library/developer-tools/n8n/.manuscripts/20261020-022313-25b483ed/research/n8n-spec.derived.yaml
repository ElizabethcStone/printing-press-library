    put:
      operationId: updateOtelSettings
      tags:
      - SettingsOtel
      summary: Set the OpenTelemetry configuration
      description: 'Set the OpenTelemetry configuration. This is a full replacement:
        every field must be provided, and a partial body is rejected. The exceptions
        are `exporterProtocol`, which defaults to `http/protobuf` when omitted, and
        `emitWorkflowStartSpan` and `emitNodeStartSpan`, which default to `false`
        when omitted. The update takes effect exactly as it would from the UI, using
        the same validation, and is applied to the running instance immediately. Fields
        managed declaratively via environment variables are read-only: attempting
        to change one is rejected with 409, while re-submitting its current value
        (as returned by GET) is accepted. Requires the `otel:manage` scope.'
      x-required-scope: otel:manage
      x-eov-operation-id: unreachable
      x-eov-operation-handler: v1/handlers/decorator-routed.handler
      x-decorator-routed: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Whether OpenTelemetry tracing is enabled.
                  example: true
                exporterProtocol:
                  type: string
                  enum:
                  - http/protobuf
                  - grpc
                  default: http/protobuf
                  description: 'The wire protocol used to export spans. Collectors
                    conventionally serve OTLP/HTTP on port 4318 and OTLP/gRPC on port
                    4317. The endpoint scheme (`http://` or `https://`) controls TLS
                    for both protocols. Optional: a write that omits it selects `http/protobuf`,
                    but an instance that sets this field to another value with an
                    environment variable rejects that write with 409.'
                  example: http/protobuf
                exporterEndpoint:
                  type: string
                  format: uri
                  pattern: ^https?:\/\/
                  description: The base URL of the OTLP collector to export traces
                    to. The value must be an `http://` or `https://` URL, because
                    the scheme selects TLS — for gRPC, `https://` uses SSL and `http://`
                    is plaintext.
                  example: http://localhost:4318
                exporterTracingPath:
                  type: string
                  description: The path appended to the endpoint for the OTLP traces
                    signal. Ignored when `exporterProtocol` is `grpc`, which takes
                    no URL path.
                  example: /v1/traces
                exporterServiceName:
                  type: string
                  minLength: 1
                  description: The `service.name` resource attribute reported on every
                    span.
                  example: n8n
                exporterHeaders:
                  type: string
                  description: Additional headers sent to the OTLP collector, as a
                    single string of comma-separated `key=value` pairs (e.g. `authorization=Bearer
                    my-token,x-tenant-id=acme`). Whitespace around each key and value
                    is trimmed; a value may contain spaces but not commas. Use an
                    empty string when unused.
                  example: authorization=Bearer my-token,x-tenant-id=acme
                tracesSampleRate:
                  type: number
                  minimum: 0
                  maximum: 1
                  description: The ratio of traces to sample, between 0 (none) and
                    1 (all).
                  example: 1
                startupConnectivityTimeoutMs:
                  type: integer
                  description: How long, in milliseconds, to wait when checking the
                    collector is reachable. Also used as the timeout for the test-trace
                    endpoint.
                  minimum: 0
                  example: 2000
                includeNodeSpans:
                  type: boolean
                  description: Whether to emit a span for each node execution in addition
                    to the workflow span.
                  example: true
                emitWorkflowStartSpan:
                  type: boolean
                  default: false
                  description: 'Whether to emit a `workflow.execute.started` span
                    with a duration of 0 ms when each execution or resumed segment
                    starts. Optional: a write that omits it selects `false`, but an
                    instance that sets this field to `true` with an environment variable
                    rejects that write with 409.'
                  example: false
                emitNodeStartSpan:
                  type: boolean
                  default: false
                  description: 'Whether to emit a `node.execute.started` span with
                    a duration of 0 ms when each node span starts. This doubles the
                    number of node spans. Has no effect when `includeNodeSpans` is
                    false. Optional: a write that omits it selects `false`, but an
                    instance that sets this field to `true` with an environment variable
                    rejects that write with 409.'
                  example: false
                injectOutbound:
                  type: boolean
                  description: Whether to inject trace context headers into outbound
                    HTTP requests made by nodes.
                  example: true
                productionExecutionsOnly:
                  type: boolean
                  description: When true, only production executions of published
                    (active) workflows are traced, not manual/test runs.
                  example: true
              required:
              - enabled
              - exporterEndpoint
              - exporterTracingPath
              - exporterServiceName
              - exporterHeaders
              - tracesSampleRate
              - startupConnectivityTimeoutMs
              - includeNodeSpans
              - injectOutbound
              - productionExecutionsOnly
              additionalProperties: false
              description: 'The OpenTelemetry configuration, matching the fields exposed
                in the UI. On a write this is a full replacement: every field must
                be provided, except `exporterProtocol`, which defaults to `http/protobuf`
                when omitted, and `emitWorkflowStartSpan` and `emitNodeStartSpan`,
                which default to `false` when omitted. Fields managed declaratively
                via environment variables are returned with their effective value.
                A write can repeat these values, but changing them returns 409.'
      responses:
        '200':
          description: Operation successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/otelSettingsPublicDto.generated'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '409':
          $ref: '#/components/responses/conflict'
        '415':
          $ref: '#/components/responses/unsupportedMediaType'
