              example: ds
            location:
              type: object
              properties:
                reference:
                  type: string
                  example: /samlp:Response/saml:Issuer
                action:
                  type: string
                  enum:
                  - before
                  - after
                  - prepend
                  - append
                  example: after
              required:
              - reference
              - action
              additionalProperties: false
          required:
          - prefix
          - location
          description: Configuration for the signature in SAML requests and responses.
          additionalProperties: false
        relayState:
          type: string
          description: Default relay state value for SAML requests. Use an empty string
            when unset.
          example: https://n8n.example.com
