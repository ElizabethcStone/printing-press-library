            required:
            - sourceProjectId
            - localId
            - name
            - status
          description: Project shells created, or matched and then updated or left
            as-is (see `projectConflictPolicy`). Present for project packages; empty
            when importing loose workflows/folders.
        bindings:
          type: object
          properties:
            workflows:
              type: object
              additionalProperties:
                type: string
            credentials:
              type: object
              additionalProperties:
                type: string
              description: Credential id from `requirements.credentials` in the package
