                required:
                - message
                - issues
        '413':
          $ref: '#/components/responses/contentTooLarge'
        '415':
          $ref: '#/components/responses/unsupportedMediaType'
        '422':
          description: Import blocked by non-conflict issues only — for example a
            delete the caller may not perform (`workflow-removal-forbidden`), unresolved
            credentials, or node types this instance does not have.
          content:
