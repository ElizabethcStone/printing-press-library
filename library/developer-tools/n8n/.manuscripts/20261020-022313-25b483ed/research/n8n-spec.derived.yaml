            skipped:
              type: array
              items:
                type: string
              description: Tags dropped from the import — not created, not renamed,
                and not attached to any imported workflow — under `tagMissingMode=do-nothing`
                or `tagConflictPolicy=skip`.
          required:
          - matched
          - created
          - renamed
          - reconciled
          - skipped
          description: Resolution of the tags referenced by the imported workflows,
            matched by source id. Tag names only.
      required:
      - package
      - workflows
      - removedWorkflows
      - removedFolders
      - folders
      - projects
      - bindings
      - credentials
      - dataTables
      - variables
      - tags
