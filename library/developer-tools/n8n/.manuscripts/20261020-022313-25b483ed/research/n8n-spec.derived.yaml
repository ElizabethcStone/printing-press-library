        if included, so a GET response can be sent back as a PUT body. The update
        takes effect exactly as it would from the UI, using the same validation. Requires
        the `securitySettings:manage` scope and the Personal Space Policy feature
        to be licensed. When the group is managed via environment variables, the write
        is rejected with 409 and no changes are made; a read still returns the current
        values.
      x-required-scope: securitySettings:manage
