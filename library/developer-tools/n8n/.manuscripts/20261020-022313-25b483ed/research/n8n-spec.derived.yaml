  /n8n-packages/import:
    post:
      x-pp-example: "n8n-pp-cli n8n-packages import-package"
      operationId: importPackage
      tags:
      - N8nPackage
      summary: 'Beta: Import an n8n package into a project'
      description: '**Beta** — breaking changes may still occur without major version
        bump.


        Imports a gzip-compressed tar package (`.n8np`) into the target project. Send
        the archive as the multipart field `package`. Optional routing uses form fields
        `projectId` and `folderId` (omit or send empty for defaults). Every optional
        mode/policy field (credential, workflow, project, folder, data table, variable,
        and tag) takes its default when omitted; the one non-fixed default is `folderConflictPolicy`,
        which follows `projectConflictPolicy` on a project package. The required `workflowConflictPolicy`
        field controls what happens when a package workflow matches an existing workflow
        by source id in the target project. Maximum upload size is `N8N_ENDPOINTS_PAYLOAD_SIZE_MAX`
        MB (default 16).


        The package must declare its manifest at `manifest.json` and include every
        file the manifest references.


        Credential references are resolved before any workflow is written.'
      x-required-scope: workflow:import
      x-eov-operation-id: unreachable
      x-eov-operation-handler: v1/handlers/decorator-routed.handler
      x-decorator-routed: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                package:
                  type: string
                  description: Gzip-compressed tar package (`.n8np`).
                  format: binary
                projectId:
                  type: string
                  description: Target project id. Omit or send empty to import into
                    the caller's personal project.
                folderId:
                  type: string
                  description: Optional folder within the target project. Omit or
                    send empty for project root.
                credentialMatchingMode:
                  type: string
                  enum:
                  - id-only
                  - name-and-type
                  - type-only
                  default: id-only
                  description: How credential references in `requirements.credentials`
                    are matched on the target instance. `id-only` (default) matches
                    by id. `name-and-type` matches credentials with the exact same
                    name and type. `type-only` matches any credential of the same
                    type. For `name-and-type` and `type-only`, candidates are ranked
                    by scope — a credential owned by the target project wins over
                    one merely shared into it, which in turn wins over a global credential;
                    if several candidates remain in the winning scope, the most recently
                    updated one is chosen.
                credentialMissingMode:
                  type: string
                  enum:
                  - must-preexist
                  - create-stub
                  default: create-stub
                  description: What to do when a credential reference cannot be resolved.
                    `create-stub` (default) creates empty credential placeholders
                    in the target project for missing references. `must-preexist`
                    requires every referenced credential to already exist.
                bindings:
                  type: string
                  description: 'Optional JSON object of explicit source→target id
                    bindings, keyed by entity type. Only `credentials` is supported
                    today: send `{"credentials":{"<packageCredentialId>":"<targetCredentialId>"}}`
                    to map credential ids from the package to credential ids on the
                    target instance. These explicit bindings are validated on type
                    and applied before `credentialMatchingMode` resolution runs.'
                  default: '{}'
                workflowConflictPolicy:
                  type: string
                  enum:
                  - new-version
                  - fail
                  - skip
                  description: '`new-version` updates matching workflows and creates
                    a new version; the archived state follows the package, so a matching
                    workflow is archived or unarchived to match it. `fail` rejects
                    the import when any matching workflow exists, and `skip` leaves
                    matching workflows unchanged. Archived workflows in the target
                    project match like any other. An archive state change also needs
                    the `workflow:delete` scope.'
                workflowPublishingPolicy:
                  type: string
                  enum:
                  - preserve-published-state
                  - match-source
                  - publish-all
                  - unpublish-all
                  default: preserve-published-state
                  description: Controls whether imported workflows are published after
                    content is written. `preserve-published-state` (default) keeps
                    new workflows inactive, and republishes an updated workflow only
                    when it was already published and the package carries the version
                    the source publishes — so drafts are never published. `match-source`
                    publishes the version the package carries when the source publishes
                    it, and unpublishes when the source publishes nothing; when the
                    source publishes a version the package does not carry, the target
                    keeps its published version. `publish-all` publishes every imported
                    workflow. `unpublish-all` leaves new workflows inactive and unpublishes
                    updated workflows that were published.
                workflowIdPolicy:
                  type: string
                  enum:
                  - new
                  - source
                  default: source
                  description: Controls the id each newly created workflow receives.
                    `source` (default) reuses the package's own workflow id on the
                    target instance, which best fits promotion use cases where the
                    same workflow moves between environments. `new` mints a fresh
                    id and records the package id as `sourceWorkflowId`, so the same
                    package can be imported repeatedly without id collisions — best
                    suited to marketplace imports. Workflows matched to an existing
                    workflow in the target project (status `updated` or `skipped`)
                    always keep that workflow's current id, regardless of policy.
                missingNodeTypeMode:
                  type: string
                  enum:
                  - fail
                  - import-anyway
                  default: fail
                  description: What to do when a workflow in the package uses a node
                    type — or a version of a node type — this instance does not have.
                    `fail` (default) rejects the import before anything is written,
                    listing every missing `(nodeType, typeVersion)` pair and the workflows
                    that use it. `import-anyway` imports the package; workflows containing
                    missing node types are never published by this import, regardless
                    of `workflowPublishingPolicy`.
                projectConflictPolicy:
                  type: string
                  enum:
                  - merge
                  - fail
                  - overwrite
                  default: merge
                  description: What to do when a project the package defines already
                    exists here (matched by id), and — unless `folderConflictPolicy`
                    overrides it — how its contents are treated. `merge` (default)
                    leaves the existing project's name, description, icon and custom
                    span attributes untouched and adds the package's contents alongside.
                    `overwrite` replaces those details with the package's; a detail
                    the package omits is left as it is, not cleared. `fail` rejects
                    the import before anything is written, with one `project-conflict`
                    issue per existing project. A package project id belonging to
                    a personal project, or to a team project the caller cannot update,
                    always rejects the import. Ignored for workflow packages.
                folderConflictPolicy:
                  type: string
                  enum:
                  - merge
                  - fail
                  - overwrite
                  description: What to do when a package folder already exists at
                    the same position in the target project. Defaults to whatever
                    `projectConflictPolicy` is, so the intent is stated once; a workflow
                    package defines no projects, so it defaults to `merge` there.
                    `merge` reuses the existing folder and merges the package's children
                    into it. `fail` rejects the import. `overwrite` reuses folders
                    as `merge` does and additionally removes workflows the package
                    does not contain — at a project's root and in folders the package
                    defines, leaving target-only folders and their contents alone.
                    Folders it does not define are then removed too, but only once
                    nothing is left inside them. Removals are listed under `removedWorkflows`
                    and `removedFolders`; see `overwriteDeletionPolicy`. A folder
                    whose id sits under a different parent, or belongs to another
                    project, always blocks the import. `overwrite` is project-packages-only,
                    needs the `workflow:delete` and `folder:delete` scopes, is rejected
                    against a `projectConflictPolicy` other than `overwrite`, and
                    blocks up front if the caller cannot delete something it would
                    remove. Folders need the `folder:create` scope and a folders-enabled
                    licence.
                overwriteDeletionPolicy:
                  type: string
                  enum:
                  - archive
                  - hard-delete
                  default: archive
                  description: 'How `folderConflictPolicy=overwrite` removes a workflow
                    the package does not contain. `archive` (default) archives it,
                    so it stays recoverable along with its execution history. `hard-delete`
                    archives it — the step that unpublishes it, which a delete will
                    not do on its own — and then deletes the workflow and its executions
                    permanently. Each entry in `removedWorkflows` reports what actually
                    happened in its `deletion` field: a `hard-delete` whose row cannot
                    be dropped yet, because unpublishing defers trigger teardown,
                    is left `archived` rather than failing an import whose content
                    is already written. Ignored unless `folderConflictPolicy` is `overwrite`.'
                dataTableMatchingMode:
                  type: string
                  enum:
                  - by-id
                  default: by-id
                  description: How data tables referenced by the package's workflows
                    are matched against the target project. `by-id` matches the target-project
                    table with the same id (imported tables keep their source id)
                    and never falls back to name matching, so a match survives a rename
                    on the target. Currently the only mode.
                dataTableMissingMode:
                  type: string
                  enum:
                  - create
                  - must-preexist
                  - do-nothing
                  default: create
                  description: Controls what happens when a referenced data table
                    has no match in the target project. `create` (default) creates
                    it from the package schema, keeping the source id, with no rows;
                    requires the `dataTable:create` scope. `must-preexist` rejects
                    the import. `do-nothing` skips creation of missing tables. Under
                    the `keep-existing`, `fail`, and `overwrite-non-destructive` schema
                    conflict policies, matched tables are still validated for schema
                    compatibility and can still block the import. The import never
                    imports table rows. Matched tables change only under `dataTableSchemaConflictPolicy=overwrite`
                    or `overwrite-non-destructive`, which keep their rows.
                dataTableSchemaConflictPolicy:
                  type: string
                  enum:
                  - keep-existing
                  - fail
                  - overwrite
                  - overwrite-non-destructive
                  default: keep-existing
                  description: 'How strictly a matched data table''s schema is compared.
                    `keep-existing` (default) accepts a target table that has every
                    package column with the same name and type. The target table can
                    have extra columns. `fail` rejects any difference, including target-only
                    columns. Under `keep-existing` and `fail`, a missing package column
                    or a type mismatch rejects the import, and the target table does
                    not change.


                    `overwrite` changes the matched target table to match the package.
                    It can remove or retype columns. The values in those columns are
                    removed. Rows and other columns are kept. When the package has
                    column ids, a column that is only renamed keeps its values. The
                    changes apply to all workflows that use the table. A blocked `keep-existing`,
                    `fail`, or `overwrite-non-destructive` import lists them in `overwriteChanges`.
                    Requires the `dataTable:update` scope only when a matched table
                    changes.


                    `overwrite-non-destructive` makes the same changes as `overwrite`,
                    but rejects the import and writes nothing when a change removes
                    or retypes a column. A target-only column counts as removed.'
                variableMissingMode:
                  type: string
                  enum:
                  - do-nothing
                  - must-preexist
                  - create-stub
                  - create-with-value
                  default: create-with-value
                  description: 'Controls what happens when a variable referenced by
                    the package''s workflows is absent from the target project and
                    the global scope (lookup order: project, then global). `create-with-value`
                    (default) creates the variable with its package value and lists
                    its name under `variables.created`. When the package carries no
                    value for it — values were excluded at export, or the exported
                    value was itself empty — it creates an empty stub listed under
                    `variables.stubbed`. `do-nothing` imports without creating the
                    variable and lists its name under `variables.missing`. `must-preexist`
                    rejects the import unless every referenced variable already resolves.
                    `create-stub` creates each missing variable with an empty value
                    at the placement scope (see `variableParentPolicy`) and lists
                    the created names under `variables.stubbed`. An import that actually
                    creates a variable requires a license that permits variables and,
                    for API key callers, the `variable:create` scope; a package whose
                    variables all already resolve creates nothing and needs neither.'
                variableConflictPolicy:
                  type: string
                  enum:
                  - keep-existing
                  - overwrite
                  - fail
                  default: keep-existing
                  description: 'What to do when a referenced variable resolves in
                    the target project or global scope but the package bundles a *different*
                    value for it. `keep-existing` (default) leaves the target value
                    untouched and reports the name under `variables.matched`. `overwrite`
                    silently replaces the value of the existing variable at whichever
                    scope it was found — the target project or the global scope, so
                    a global variable other projects also read can be rewritten by
                    this import — and reports the name under `variables.updated`;
                    it needs a license that permits variables, the `variable:update`
                    / `projectVariable:update` permission on that scope, and, for
                    API key callers, the `variable:update` scope. `fail` rejects the
                    import with a 409 instead. Every policy leaves a resolved variable
                    alone when there is nothing to change — either the package bundles
                    no value for it (values were excluded at export, or the exported
                    value was itself empty), or the value it bundles already matches
                    the target''s. The reverse does not hold: a resolved variable
                    holding an empty value — a stub an earlier import created, say
                    — still counts as a value, so `overwrite` fills it and `fail`
                    rejects it. Under `overwrite`, a project package whose projects
                    hold *different* values for a name they all resolve to one row
                    — a global none of them shadows, typically — is rejected with
                    a 409: one row cannot carry both values, and the import will not
                    pick for you. Give the projects their own variables in the target,
                    or import them separately.'
                variableParentPolicy:
                  type: string
                  enum:
                  - project
                  - global
                  description: 'Where `create-with-value` and `create-stub` create
                    missing variables for workflow/folder packages. `project` — also
                    the behaviour when the field is omitted — creates them in the
                    import target project (`projectId`, else the caller''s personal
                    project). `global` creates them at the global scope. The license
                    and `variable:create` requirements described under `variableMissingMode`
                    apply to both placements. Must be omitted for project packages,
                    which reject it with a 400: their placement follows the package
                    layout, where a variable bundled under a project is created in
                    that project and one bundled at the top level is created globally.'
                tagMissingMode:
                  type: string
                  enum:
                  - create
                  - do-nothing
                  default: create
                  description: What to do when a tag referenced by the package's workflows
                    has no tag with the same id on the target instance (tags are matched
                    by source id, never by name). `create` (default) creates the tag
                    globally with its package (source) id and name; when the import
                    would create a tag this needs an API key carrying the `tag:create`
                    scope. `do-nothing` imports the workflows without the missing
                    tags — nothing is created and the dropped names are listed under
                    `tags.skipped`.
                tagConflictPolicy:
                  type: string
                  enum:
                  - skip
                  - fail
                  - rename
                  default: skip
                  description: What to do when a referenced tag conflicts on the target
                    instance — either the same-id target tag carries a different name
                    (rename drift), or the tag's name is already held by a different
                    tag (name collision). `skip` (default) drops the conflicted tags
                    from the import (not created, not renamed, not attached anywhere;
                    the import proceeds and lists them under `tags.skipped`). `fail`
                    rejects the import with a 409. `rename` renames a drifted target
                    tag to the package name, and reconciles a name collision by re-keying
                    the existing tag to the package (source) id — its name, workflow
                    and folder taggings follow; both need an API key carrying the
                    `tag:update` scope when the import would rename or reconcile a
                    tag. A drifted tag whose package name is held by another tag still
                    rejects the import (rename degrades to fail).
              required:
              - package
              - workflowConflictPolicy
              additionalProperties: false
      responses:
        '200':
          description: Operation successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/importResultDto.generated'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '409':
          description: Import blocked by at least one conflict among the issues —
            a workflow source-id conflict, a folder conflict, a tag conflict (rename
            drift or name collision), a data table conflict (id owned by another project,
            or a name that another table in the project has), a variable whose bundled
            value differs from the resolved target, or a selected destination also
            named for deletion.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  issues:
                    type: array
                    items:
                      $ref: '#/components/schemas/importBlockingIssue.generated'
                required:
                - message
                - issues
        '413':
          $ref: '#/components/responses/contentTooLarge'
        '415':
          $ref: '#/components/responses/unsupportedMediaType'
        '422':
          description: Import blocked by non-conflict issues only — for example unresolved
            credentials or variables, node types this instance does not have, a delete
            the caller may not perform, or variable stubs whose creation would exceed
            the instance variable quota.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  issues:
                    type: array
                    items:
                      $ref: '#/components/schemas/importBlockingIssue.generated'
                required:
                - message
                - issues
        '500':
          $ref: '#/components/responses/internalServerError'
  /n8n-packages/import-selection:
    post:
      x-pp-example: "n8n-pp-cli n8n-packages import-package-selection"
      operationId: importPackageSelection
      tags:
      - N8nPackage
      summary: 'Beta: Import a selected subset of workflows from an n8n package'
      description: '**Beta** — breaking changes may still occur without major version
        bump.


        Imports a chosen subset of workflows from one source project of a gzip-compressed
        tar package (`.n8np`), instead of the whole package. Send the archive as the
        multipart field `package`. The import is **additive** (cherry-pick): it never
        removes a workflow the selection omits. It creates or updates only the workflows
        named in `selectedWorkflowIds`, and deletes only the destination workflows
        named in `deletedWorkflowIds`.


        `selectedProjectId` names the single source project the selection is scoped
        to (its id as it appears in the package). The selected workflows are written
        into the instance project whose id matches that source project, which is created
        if it does not yet exist; there is no separate target-project field. `selectedWorkflowIds`
        are source ids within that project; ids that belong to another project are
        dropped. `deletedWorkflowIds` are destination ids in the same project; an
        absent id is a tolerated no-op, and a delete needs the `workflow:delete` scope.
        A delete id must not match the destination id of a selected workflow, including
        when `workflowConflictPolicy=skip`. This overlap returns a 409 before any
        writes.


        The package must be a project package (a workflow package is rejected with
        a 400). The cherry-pick conflict policies (folder, tag, and project) are fixed
        and are not accepted here; only `workflowConflictPolicy`, `workflowIdPolicy`,
        and `overwriteDeletionPolicy` are configurable. Maximum upload size is `N8N_ENDPOINTS_PAYLOAD_SIZE_MAX`
        MB (default 16). The caller is authorised through the `workflow:import` scope.'
      x-required-scope: workflow:import
      x-eov-operation-id: unreachable
      x-eov-operation-handler: v1/handlers/decorator-routed.handler
      x-decorator-routed: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                package:
                  type: string
                  description: Gzip-compressed tar package (`.n8np`).
                  format: binary
                selectedProjectId:
                  type: string
                  minLength: 1
                  description: Id of the single source project the selection is scoped
                    to, as it appears in the package.
                selectedWorkflowIds:
                  type: string
                  description: JSON-encoded array of source workflow ids to import
                    from `selectedProjectId`, e.g. `["wf-1","wf-2"]`. An empty array
                    (`[]`) is allowed — useful for a delete-only request. Ids outside
                    the scoped project are dropped.
                deletedWorkflowIds:
                  type: string
                  description: Optional JSON-encoded array of destination workflow
                    ids to remove from the scoped project, e.g. `["wf-3"]`. Removal
                    happens even under the additive profile, and the manner of removal
                    follows `overwriteDeletionPolicy` (archive by default). An absent
                    id is a no-op unless it is also a selected destination. Must not
                    contain a selected workflow's destination id. Needs the `workflow:delete`
                    scope.
                workflowConflictPolicy:
                  type: string
                  enum:
                  - new-version
                  - fail
                  - skip
                  default: new-version
                  description: What happens when a selected workflow matches an existing
                    workflow by source id in the target project. `new-version` (default)
                    updates it and creates a new version; `fail` rejects the import
                    when any matching workflow exists; `skip` leaves matching workflows
                    unchanged. An archive state change also needs the `workflow:delete`
                    scope.
                workflowIdPolicy:
                  type: string
                  enum:
                  - new
                  - source
                  default: source
                  description: Controls the id each newly created workflow receives.
                    `source` (default) reuses the package's own workflow id on the
                    target instance; `new` mints a fresh id and records the package
                    id as `sourceWorkflowId`. Workflows matched to an existing workflow
                    keep that workflow's current id, regardless of policy.
                overwriteDeletionPolicy:
                  type: string
                  enum:
                  - archive
                  - hard-delete
                  default: archive
                  description: 'How the ids in `deletedWorkflowIds` are removed. `archive`
                    (default) archives each one, so it stays recoverable along with
                    its execution history. `hard-delete` archives it — the step that
                    unpublishes it, which a delete will not do on its own — and then
                    deletes the workflow and its executions permanently. Each entry
                    in `removedWorkflows` reports what actually happened in its `deletion`
                    field: a `hard-delete` whose row cannot be dropped yet, because
                    unpublishing defers trigger teardown, is left `archived` rather
                    than failing an import whose content is already written.'
              required:
              - package
              - selectedProjectId
              - selectedWorkflowIds
              additionalProperties: false
      responses:
        '200':
          description: Operation successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/importResultDto.generated'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
