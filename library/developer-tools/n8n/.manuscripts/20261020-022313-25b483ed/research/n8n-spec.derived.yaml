          example: Production
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    workflowSettings:
      type: object
      additionalProperties: false
      properties:
        saveExecutionProgress:
          type: boolean
        saveManualExecutions:
          type: boolean
        saveDataErrorExecution:
          type: string
          enum:
          - all
          - none
        saveDataSuccessExecution:
          type: string
          enum:
          - all
          - none
        executionTimeout:
          type: number
          example: 3600
          maxLength: 3600
        errorWorkflow:
          type: string
          example: VzqKEW0ShTXA5vPj
          description: The ID of the workflow that contains the error trigger node.
        timezone:
          type: string
          example: America/New_York
        executionOrder:
          type: string
          example: v1
        binaryMode:
          type: string
          enum:
          - separate
          - combined
          description: 'Controls how binary data is resolved from a node''s input.
            This is a derived,

            internal setting rather than something intended to be set programmatically.

            It is included in workflow responses for reference, but any value sent
            when

            creating or updating a workflow is ignored.

            '
        callerPolicy:
          type: string
          enum:
          - any
          - none
          - workflowsFromAList
          - workflowsFromSameOwner
          description: "Controls which workflows are allowed to call this workflow\
            \ using the Execute Workflow node.\nDefaults to workflowsFromSameOwner.\n\
            \nAvailable options:\n- `any`: Any workflow can call this workflow (no\
            \ restrictions)\n- `none`: No other workflows can call this workflow (completely\
            \ blocked)\n- `workflowsFromSameOwner` (default): Only workflows owned\
            \ by the same project can call this workflow\n  * For personal projects:\
            \ Only workflows created by the same user\n  * For team projects: Only\
            \ workflows within the same team project\n- `workflowsFromAList`: Only\
            \ specific workflows listed in the `callerIds` field can call this workflow\n\
            \  * Requires the `callerIds` field to specify which workflow IDs are\
            \ allowed\n  * See `callerIds` field documentation for usage\n"
          example: workflowsFromSameOwner
        callerIds:
          type: string
          description: Comma-separated list of workflow IDs allowed to call this workflow
            (only used with workflowsFromAList policy)
          example: 14, 18, 23
        timeSavedMode:
          type: string
          enum:
          - fixed
          - dynamic
          description: "Controls how the time saved per execution is calculated.\n\
            Available options:\n- `fixed`: Uses a predetermined time value specified\
            \ in the `timeSavedPerExecution` field.\n  * Requires the `timeSavedPerExecution`\
            \ field to be set\n  * Use when the time saved is consistent across all\
            \ executions\n- `dynamic`: Automatically calculates time saved based on\
            \ actual execution metrics\n  * The `timeSavedPerExecution` field is ignored\
            \ when this mode is active\n  * Use when time saved varies between executions\n"
        timeSavedPerExecution:
          type: number
          description: Estimated time saved per execution in minutes
        redactionPolicy:
          type: string
          enum:
          - none
          - non-manual
          - manual-only
          - all
          description: 'Controls whether execution data is redacted for this workflow.


            Available options:

            - `none` (default): No redaction — all execution data is stored.

            - `non-manual`: Redact production (non-manually triggered) executions
            only.

            - `manual-only`: Redact manually triggered executions only.

            - `all`: Redact all executions (manual and production).


            When the instance has a redaction floor configured, the policy must be
            equal to

            or stricter than the floor. A policy weaker than the floor is rejected
            with 422

            on create, and on update when it changes the stored policy; an unchanged

            pre-existing below-floor policy is preserved (the floor is not applied

            retroactively). Omitting this field when creating a workflow seeds it
            to the

            instance floor instead.

            '
          example: non-manual
        availableInMCP:
          type: boolean
          description: 'Controls whether this workflow is accessible via the Model
            Context Protocol (MCP).

            Defaults to false.


            When enabled, this workflow can be called by MCP clients (AI assistants
            and other tools

            that support MCP). This allows external AI tools to discover and execute
            this workflow

            as part of their capabilities.


            Requirements for enabling MCP access:

            - The workflow must be active (not deactivated)

            - The workflow must contain at least one active Webhook node

            - Only webhook-triggered workflows can be exposed via MCP


            Security note: When a workflow is available in MCP, it can be discovered
            and executed

            by any MCP client that has the appropriate API credentials for your n8n
            instance.

            '
          example: false
        customTelemetryTags:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - key
            - value
            properties:
              key:
                type: string
              value:
                type: string
        credentialResolverId:
          type: string
          description: 'ID of the credential resolver used to resolve credentials
            for this workflow.

            This is a derived, internal setting managed via the workflow''s credential

            resolver configuration rather than something intended to be set programmatically.

            It is included in workflow responses for reference, but any value sent
            when

            creating or updating a workflow is ignored.

            '
