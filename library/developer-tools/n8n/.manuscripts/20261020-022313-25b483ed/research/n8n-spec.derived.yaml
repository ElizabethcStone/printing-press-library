                both a matched existing credential and a credential created as a stub
                under `credentialMissingMode=create-stub`.
          required:
          - workflows
          - credentials
          description: Source id → target id mappings produced during import, one
            map per entity type. Each value maps an id as it appeared in the package
            to the id on the target instance.
        credentials:
          type: object
          properties:
            matched:
              type: array
              items:
                type: string
              description: Source credential ids from the package that matched existing
                credentials on the target instance.
            stubbed:
              type: array
              items:
                type: string
              description: Source credential ids for which empty placeholder credentials
                were created in the target project.
          required:
          - matched
          - stubbed
          description: Source credential ids grouped by whether they matched an existing
            credential or were created as stubs. Full source→target id mapping is
            in `bindings.credentials`.
        dataTables:
          type: object
          properties:
            matched:
              type: integer
              minimum: 0
            created:
              type: integer
              minimum: 0
            updated:
              type: integer
              minimum: 0
          required:
          - matched
          - created
          - updated
        variables:
          type: object
          properties:
            matched:
              type: array
              items:
                type: string
              description: Variable names that resolved to an existing variable (importing
                project's scope first, then global) and were left untouched. A resolved
                variable this import rewrote is listed under `updated` instead.
            missing:
              type: array
              items:
                type: string
              description: Variable names still unresolved after import. Under `variableMissingMode=do-nothing`
                these are warnings — the import still succeeds and nothing is created.
                A successful `create-stub` or `create-with-value` import normally
                leaves this empty.
            created:
              type: array
              items:
                type: string
              description: Variable names created with a package value under `variableMissingMode=create-with-value`.
                Empty stubs are listed under `stubbed`.
            stubbed:
              type: array
              items:
                type: string
              description: Variable names created with an empty value by this import
                under `variableMissingMode=create-stub`, or because `create-with-value`
                had no exported value. Empty for other outcomes.
            updated:
              type: array
              items:
                type: string
              description: Variable names whose existing value this import replaced
                with the package value under `variableConflictPolicy=overwrite`. Empty
                for other policies.
          required:
          - matched
          - missing
          - created
          - stubbed
          - updated
          description: Resolution of the package's variable requirements. Names only
            — values never travel in the response. For project packages these arrays
            are package-level unions of per-destination outcomes and may overlap (for
            example, a name may be created with a value in one project and stubbed
            in another); classification under concurrent external writes is best-effort.
        tags:
          type: object
          properties:
            matched:
              type: array
              items:
                type: string
              description: Tags that resolved to an existing tag with the same id
                and name; attached as-is.
            created:
              type: array
              items:
                type: string
              description: Tags created by this import, by name, under `tagMissingMode=create`.
            renamed:
              type: array
              items:
                type: string
              description: Target tags renamed to the package name under `tagConflictPolicy=rename`;
                listed by their new name.
            reconciled:
              type: array
              items:
                type: string
              description: Existing target tags re-keyed to the package (source) id
