              properties:
                expectedSource:
                  type: object
                  properties:
                    configId:
                      type: string
                      minLength: 1
                      maxLength: 36
                    branchName:
                      type: string
                      minLength: 1
                    commitSha:
                      type: string
                      pattern: ^[0-9a-f]{40}([0-9a-f]{24})?$
                  required:
                  - configId
                  - branchName
                  - commitSha
                  additionalProperties: false
                confirmDestructiveChanges:
                  type: boolean
                  description: 'Also applies destructive data table changes, which
                    a `destructive-change` conflict reports: removed or retyped columns.
                    The values in those columns are removed. Rows and other columns
                    are kept. The confirmation covers every such change when Continue
                    runs, including changes that are not in the reviewed result.'
              required:
              - expectedSource
              additionalProperties: false
