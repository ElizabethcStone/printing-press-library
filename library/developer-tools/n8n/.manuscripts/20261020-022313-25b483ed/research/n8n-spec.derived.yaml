          type: boolean
          description: Whether authentication requests are signed.
          example: false
        wantAssertionsSigned:
          type: boolean
          description: Whether signed assertions are required.
          example: true
        wantMessageSigned:
          type: boolean
          description: Whether signed SAML messages are required.
          example: true
        emailVerifiedRequired:
          type: boolean
          description: Whether the identity provider must assert that the user's email
            address is verified before a login is linked to an existing user by email.
            When disabled, only an explicit negative assertion is rejected.
          example: false
        signingPrivateKey:
          type: string
          description: PEM-encoded private key for signing SAML AuthnRequests. Redacted
