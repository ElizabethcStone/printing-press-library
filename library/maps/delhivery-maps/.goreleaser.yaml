version: 2
project_name: delhivery-maps-pp-cli
changelog:
  disable: true
builds:
  - id: delhivery-maps-pp-cli
    main: ./cmd/delhivery-maps-pp-cli
    binary: delhivery-maps-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/maps/delhivery-maps/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: delhivery-maps-pp-mcp
    main: ./cmd/delhivery-maps-pp-mcp
    binary: delhivery-maps-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: delhivery-maps-pp-cli
    repository:
      owner: somsamantray
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Every Delhivery Maps endpoint, plus bulk address cleaning, trip costing and fleet planning that survive rate limits and token expiry."
    install: |
      bin.install "delhivery-maps-pp-cli"
      bin.install "delhivery-maps-pp-mcp"
