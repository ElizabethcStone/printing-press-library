schema_version = 2
name = "pingenerator-pp-cli"
display_name = "Pin Generator"
description = "Every Pin Generator MCP tool as a typed command, with credit-safe dry runs, preflight pricing and a local spend ledger."
project_kind = "cli"

[secrets.file]
path = "~/.config/pingenerator-pp-cli/config.toml"

[sync]
default = false

[sync.keys]
PINGENERATOR_ACCESS_KEY = true
